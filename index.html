<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#673ab7">
<title>मेरी आत्मकथा - मेरी जिंदगी की किताब</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f4f1f8;
  color:#222;
}

header{
  background:linear-gradient(135deg,#673ab7,#512da8);
  color:white;
  padding:20px 15px;
  text-align:center;
  box-shadow:0 3px 10px #999;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:7px 0 0;
  font-size:14px;
}

.container{
  max-width:850px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #ddd;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:180px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  margin:5px 3px;
  font-size:15px;
  cursor:pointer;
}

.primary{
  background:#673ab7;
  color:white;
}

.green{
  background:#198754;
  color:white;
}

.red{
  background:#dc3545;
  color:white;
}

.blue{
  background:#0d6efd;
  color:white;
}

.gray{
  background:#e9ecef;
  color:#222;
}

.voice{
  background:#ff5722;
  color:white;
  width:100%;
  font-size:17px;
  padding:14px;
}

.voice.listening{
  background:#d32f2f;
}

.chapter{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin:10px 0;
}

.chapter h3{
  margin-top:0;
  color:#512da8;
}

.chapter-text{
  white-space:pre-wrap;
  line-height:1.7;
}

.actions{
  margin-top:10px;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

#bookView{
  display:none;
}

.book-page{
  background:white;
  padding:30px;
  border-radius:12px;
  line-height:1.9;
}

.book-page h2{
  text-align:center;
  color:#512da8;
}

.search{
  margin-bottom:15px;
}

.footer{
  text-align:center;
  color:#777;
  padding:20px;
  font-size:13px;
}

@media(max-width:600px){
  header h1{font-size:21px}
  .container{padding:10px}
  .card{padding:13px}
  button{font-size:14px}
}

@media print{
  header,.no-print,.footer{
    display:none!important;
  }

  body{
    background:white;
  }

  #bookView{
    display:block!important;
  }

  .book-page{
    box-shadow:none;
  }
}
</style>
</head>

<body>

<header>
  <h1>📖 मेरी आत्मकथा</h1>
  <p>मेरी जिंदगी की किताब</p>
</header>

<div class="container no-print">

  <div class="card">
    <label>🔎 अपनी कहानी खोजें</label>
    <input
      type="text"
      id="search"
      placeholder="अध्याय या कहानी खोजें..."
      oninput="showChapters()"
    >
  </div>

  <div class="card">
    <label>अध्याय का नाम</label>
    <input
      type="text"
      id="chapterTitle"
      placeholder="जैसे - मेरा बचपन"
    >

    <br><br>

    <label>मेरी कहानी</label>
    <textarea
      id="story"
      placeholder="यहाँ अपनी जिंदगी की कहानी लिखें..."
    ></textarea>

    <button class="voice" id="voiceBtn" onclick="startVoice()">
      🎤 आवाज़ से लिखें
    </button>

    <button class="primary" onclick="saveChapter()">
      💾 अध्याय सेव करें
    </button>

    <button class="gray" onclick="clearForm()">
      ✖ साफ करें
    </button>
  </div>

  <div class="card">
    <h2>📚 मेरे अध्याय</h2>

    <div id="chapterList"></div>
  </div>

  <div class="card">
    <h2>⚙️ किताब के विकल्प</h2>

    <button class="blue" onclick="openBook()">
      📖 पूरी किताब देखें
    </button>

    <button class="green" onclick="printBook()">
      🖨️ PDF / Print
    </button>

    <button class="primary" onclick="backupData()">
      📥 Backup
    </button>

    <button class="gray" onclick="document.getElementById('importFile').click()">
      📤 Backup वापस लाएँ
    </button>

    <input
      type="file"
      id="importFile"
      accept=".json"
      style="display:none"
      onchange="importData(event)"
    >
  </div>

</div>

<div class="container" id="bookView">
  <div class="book-page">
    <h2>📖 मेरी आत्मकथा</h2>
    <div id="bookContent"></div>

    <div class="no-print" style="text-align:center;margin-top:20px;">
      <button class="gray" onclick="closeBook()">⬅ वापस जाएँ</button>
      <button class="green" onclick="window.print()">🖨️ PDF बनाएं</button>
    </div>
  </div>
</div>

<div class="footer">
  मेरी जिंदगी की किताब ❤️
</div>

<script>

let chapters = JSON.parse(
  localStorage.getItem("meriAtmakatha")
) || [];

let editIndex = -1;


/* =========================
   SAVE CHAPTER
========================= */

function saveChapter(){

  const title =
    document.getElementById("chapterTitle").value.trim();

  const text =
    document.getElementById("story").value.trim();

  if(!title){
    alert("कृपया अध्याय का नाम लिखें।");
    return;
  }

  if(!text){
    alert("कृपया अपनी कहानी लिखें।");
    return;
  }

  const data = {
    title:title,
    text:text,
    date:new Date().toLocaleDateString("hi-IN")
  };

  if(editIndex === -1){
    chapters.push(data);
  }else{
    chapters[editIndex] = data;
    editIndex = -1;
  }

  localStorage.setItem(
    "meriAtmakatha",
    JSON.stringify(chapters)
  );

  clearForm();
  showChapters();

  alert("अध्याय सफलतापूर्वक सेव हो गया।");
}


/* =========================
   SHOW CHAPTERS
========================= */

function showChapters(){

  const list =
    document.getElementById("chapterList");

  const search =
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  list.innerHTML = "";

  let found = 0;

  chapters.forEach((chapter,index)=>{

    const content =
      (chapter.title+" "+chapter.text)
      .toLowerCase();

    if(search && !content.includes(search)){
      return;
    }

    found++;

    const div =
      document.createElement("div");

    div.className = "chapter";

    div.innerHTML = `
      <h3>${escapeHTML(chapter.title)}</h3>

      <small>📅 ${chapter.date || ""}</small>

      <p class="chapter-text">
        ${escapeHTML(chapter.text)}
      </p>

      <div class="actions">

        <button class="primary"
          onclick="editChapter(${index})">
          ✏️ Edit
        </button>

        <button class="red"
          onclick="deleteChapter(${index})">
          🗑️ Delete
        </button>

      </div>
    `;

    list.appendChild(div);
  });

  if(found === 0){

    list.innerHTML = `
      <div class="empty">
        अभी कोई अध्याय नहीं है।
      </div>
    `;
  }
}


/* =========================
   EDIT
========================= */

function editChapter(index){

  const chapter = chapters[index];

  document.getElementById("chapterTitle").value =
    chapter.title;

  document.getElementById("story").value =
    chapter.text;

  editIndex = index;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   DELETE
========================= */

function deleteChapter(index){

  if(!confirm("क्या आप यह अध्याय हटाना चाहते हैं?")){
    return;
  }

  chapters.splice(index,1);

  localStorage.setItem(
    "meriAtmakatha",
    JSON.stringify(chapters)
  );

  showChapters();
}


/* =========================
   CLEAR
========================= */

function clearForm(){

  document.getElementById("chapterTitle").value = "";

  document.getElementById("story").value = "";

  editIndex = -1;
}


/* =========================
   VOICE TO TEXT
========================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "आपके ब्राउज़र में Voice Typing उपलब्ध नहीं है। Chrome में खोलकर कोशिश करें।"
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "hi-IN";

  recognition.continuous = true;

  recognition.interimResults = true;

  const button =
    document.getElementById("voiceBtn");

  button.classList.add("listening");

  button.innerText =
    "🔴 सुन रहा हूँ... बोलिए";

  recognition.start();

  recognition.onresult = function(event){

    let finalText = "";

    for(
      let i=event.resultIndex;
      i<event.results.length;
      i++
    ){

      if(event.results[i].isFinal){

        finalText +=
          event.results[i][0].transcript;
      }
    }

    if(finalText){

      const textarea =
        document.getElementById("story");

      textarea.value +=
        (textarea.value ? " " : "") +
        finalText;
    }
  };

  recognition.onerror = function(){

    button.classList.remove("listening");

    button.innerText =
      "🎤 आवाज़ से लिखें";
  };

  recognition.onend = function(){

    button.classList.remove("listening");

    button.innerText =
      "🎤 आवाज़ से लिखें";
  };
}


/* =========================
   BOOK VIEW
========================= */

function openBook(){

  if(chapters.length === 0){

    alert("पहले कम से कम एक अध्याय सेव करें।");

    return;
  }

  document.querySelector(".container.no-print")
    .style.display = "none";

  document.getElementById("bookView")
    .style.display = "block";

  let html = "";

  chapters.forEach((chapter,index)=>{

    html += `
      <h3>${index+1}. ${escapeHTML(chapter.title)}</h3>

      <small>📅 ${chapter.date || ""}</small>

      <p style="white-space:pre-wrap;">
        ${escapeHTML(chapter.text)}
      </p>

      <hr>
    `;
  });

  document.getElementById("bookContent")
    .innerHTML = html;

  window.scrollTo(0,0);
}


/* =========================
   CLOSE BOOK
========================= */

function closeBook(){

  document.getElementById("bookView")
    .style.display = "none";

  document.querySelector(".container.no-print")
    .style.display = "block";
}


/* =========================
   PRINT / PDF
========================= */

function printBook(){

  openBook();

  setTimeout(()=>{
    window.print();
  },300);
}


/* =========================
   BACKUP
========================= */

function backupData(){

  const data =
    JSON.stringify(chapters,null,2);

  const blob =
    new Blob(
      [data],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "meri-atmakatha-backup.json";

  a.click();

  URL.revokeObjectURL(url);
}


/* =========================
   IMPORT
========================= */

function importData(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = function(e){

    try{

      const data =
        JSON.parse(e.target.result);

      if(!Array.isArray(data)){
        throw new Error();
      }

      chapters = data;

      localStorage.setItem(
        "meriAtmakatha",
        JSON.stringify(chapters)
      );

      showChapters();

      alert("Backup सफलतापूर्वक वापस आ गया।");

    }catch(error){

      alert("Backup file सही नहीं है।");
    }
  };

  reader.readAsText(file);
}


/* =========================
   SECURITY / HTML ESCAPE
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   START
========================= */

showChapters();

</script>

</body>
</html>
