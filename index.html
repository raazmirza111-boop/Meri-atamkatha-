<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b3cc4">
<title>मेरी आत्मकथा - मेरी जिंदगी की किताब</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:linear-gradient(135deg,#f5f3ff,#eef4ff);
  color:#222;
}

header{
  background:linear-gradient(135deg,#5b3cc4,#7b4fd1,#3949ab);
  color:white;
  padding:24px 15px;
  text-align:center;
  box-shadow:0 4px 15px rgba(50,40,100,.25);
}

header h1{
  margin:0;
  font-size:27px;
}

header p{
  margin:8px 0 0;
  font-size:14px;
  opacity:.92;
}

.container{
  max-width:850px;
  margin:auto;
  padding:16px;
}

.card{
  background:rgba(255,255,255,.97);
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 18px rgba(70,60,110,.10);
  border:1px solid rgba(100,80,160,.08);
}

.card h2{
  margin-top:0;
  color:#4d35a5;
  font-size:20px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
  color:#40345f;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #d5d0e5;
  border-radius:12px;
  font-size:16px;
  outline:none;
  background:#fff;
  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#6b4bd1;
  box-shadow:0 0 0 3px rgba(107,75,209,.10);
}

textarea{
  min-height:190px;
  resize:vertical;
  line-height:1.7;
}

button{
  border:0;
  border-radius:11px;
  padding:12px 16px;
  margin:5px 3px;
  font-size:15px;
  cursor:pointer;
  transition:.2s;
  font-weight:600;
}

button:active{
  transform:scale(.97);
}

.primary{
  background:#5b3cc4;
  color:white;
}

.primary:hover{
  background:#4c31ad;
}

.green{
  background:#198754;
  color:white;
}

.red{
  background:#dc3545;
  color:white;
}

.blue{
  background:#246bfd;
  color:white;
}

.gray{
  background:#eef0f4;
  color:#333;
}

.voice{
  background:linear-gradient(135deg,#ff7043,#f4511e);
  color:white;
  width:100%;
  font-size:17px;
  padding:14px;
  margin-top:12px;
}

.voice.listening{
  background:linear-gradient(135deg,#e53935,#b71c1c);
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(229,57,53,.4)}
  70%{box-shadow:0 0 0 10px rgba(229,57,53,0)}
  100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}
}

.voice-box{
  margin-top:15px;
  padding:16px;
  border-radius:14px;
  background:#f7f5ff;
  border:1px solid #e2dcfa;
}

.voice-title{
  font-weight:bold;
  color:#4d35a5;
  margin-bottom:10px;
}

.voice-controls{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.voice-controls button{
  flex:1;
  min-width:90px;
}

.chapter{
  border:1px solid #e2deeb;
  border-radius:14px;
  padding:16px;
  margin:12px 0;
  background:#fff;
}

.chapter h3{
  margin-top:0;
  color:#512da8;
}

.chapter-text{
  white-space:pre-wrap;
  line-height:1.8;
  color:#444;
}

.actions{
  margin-top:12px;
}

.empty{
  text-align:center;
  color:#777;
  padding:25px 10px;
}

#bookView{
  display:none;
}

.book-page{
  background:white;
  padding:30px;
  border-radius:14px;
  line-height:1.9;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.book-page h2{
  text-align:center;
  color:#512da8;
}

.search{
  margin-bottom:15px;
}

.footer{
  text-align:center;
  color:#777;
  padding:22px;
  font-size:13px;
}

.small-note{
  font-size:13px;
  color:#777;
  margin-top:8px;
  line-height:1.5;
}

.row{
  display:flex;
  gap:10px;
}

.row>div{
  flex:1;
}

@media(max-width:600px){

  header h1{
    font-size:22px;
  }

  .container{
    padding:10px;
  }

  .card{
    padding:15px;
  }

  button{
    font-size:14px;
  }

  .row{
    flex-direction:column;
    gap:0;
  }

  .voice-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .voice-controls button{
    min-width:0;
  }

}

@media print{

  header,.no-print,.footer{
    display:none!important;
  }

  body{
    background:white;
  }

  #bookView{
    display:block!important;
  }

  .book-page{
    box-shadow:none;
  }
}
</style>
</head>

<body>

<header>
  <h1>📖 मेरी आत्मकथा</h1>
  <p>मेरी जिंदगी की किताब ❤️</p>
</header>

<div class="container no-print">

  <!-- SEARCH -->
  <div class="card">
    <label>🔎 अपनी कहानी खोजें</label>

    <input
      type="text"
      id="search"
      placeholder="अध्याय या कहानी खोजें..."
      oninput="showChapters()"
    >
  </div>


  <!-- WRITE STORY -->
  <div class="card">

    <h2>✍️ अपनी कहानी लिखें</h2>

    <label>अध्याय का नाम</label>

    <input
      type="text"
      id="chapterTitle"
      placeholder="जैसे - मेरा बचपन"
    >

    <br><br>

    <label>मेरी कहानी</label>

    <textarea
      id="story"
      placeholder="यहाँ अपनी जिंदगी की कहानी लिखें..."
    ></textarea>


    <!-- VOICE TO TEXT -->

    <button
      class="voice"
      id="voiceBtn"
      onclick="startVoice()"
    >
      🎤 आवाज़ से लिखें
    </button>

    <div class="small-note">
      बटन दबाएँ और बोलना शुरू करें। आपकी आवाज़ टेक्स्ट में बदल जाएगी।
    </div>


    <!-- TEXT TO SPEECH -->

    <div class="voice-box">

      <div class="voice-title">
        🔊 कहानी सुनें
      </div>

      <div class="row">

        <div>
          <label>भाषा</label>

          <select id="speechLanguage">
            <option value="hi-IN">🇮🇳 हिंदी</option>
            <option value="ur-IN">🇮🇳 اردو</option>
            <option value="en-IN">🇮🇳 English (India)</option>
            <option value="en-US">🇺🇸 English (US)</option>
            <option value="ar-SA">🇸🇦 العربية</option>
            <option value="bn-IN">🇮🇳 বাংলা</option>
            <option value="mr-IN">🇮🇳 मराठी</option>
            <option value="gu-IN">🇮🇳 ગુજરાતી</option>
            <option value="pa-IN">🇮🇳 ਪੰਜਾਬੀ</option>
            <option value="ta-IN">🇮🇳 தமிழ்</option>
            <option value="te-IN">🇮🇳 తెలుగు</option>
            <option value="kn-IN">🇮🇳 ಕನ್ನಡ</option>
            <option value="ml-IN">🇮🇳 മലയാളം</option>
          </select>
        </div>

        <div>
          <label>आवाज़ की गति</label>

          <select id="speechRate">
            <option value="0.6">बहुत धीमी</option>
            <option value="0.8">धीमी</option>
            <option value="1" selected>सामान्य</option>
            <option value="1.2">तेज़</option>
            <option value="1.4">बहुत तेज़</option>
          </select>
        </div>

      </div>


      <div class="voice-controls">

        <button
          class="blue"
          onclick="speakStory()"
        >
          ▶️ सुनें
        </button>

        <button
          class="gray"
          onclick="pauseSpeech()"
        >
          ⏸️ रोकें
        </button>

        <button
          class="green"
          onclick="resumeSpeech()"
        >
          ▶️ जारी रखें
        </button>

        <button
          class="red"
          onclick="stopSpeech()"
        >
          ⏹️ बंद करें
        </button>

      </div>

      <div class="small-note">
        नोट: उपलब्ध आवाज़ें आपके मोबाइल और ब्राउज़र पर निर्भर करती हैं।
      </div>

    </div>


    <br>

    <button
      class="primary"
      onclick="saveChapter()"
    >
      💾 अध्याय सेव करें
    </button>

    <button
      class="gray"
      onclick="clearForm()"
    >
      ✖ साफ करें
    </button>

  </div>


  <!-- CHAPTERS -->

  <div class="card">

    <h2>📚 मेरे अध्याय</h2>

    <div id="chapterList"></div>

  </div>


  <!-- BOOK OPTIONS -->

  <div class="card">

    <h2>⚙️ किताब के विकल्प</h2>

    <button
      class="blue"
      onclick="openBook()"
    >
      📖 पूरी किताब देखें
    </button>

    <button
      class="green"
      onclick="printBook()"
    >
      🖨️ PDF / Print
    </button>

    <button
      class="primary"
      onclick="backupData()"
    >
      📥 Backup
    </button>

    <button
      class="gray"
      onclick="document.getElementById('importFile').click()"
    >
      📤 Backup वापस लाएँ
    </button>

    <input
      type="file"
      id="importFile"
      accept=".json"
      style="display:none"
      onchange="importData(event)"
    >

  </div>

</div>


<!-- BOOK -->

<div class="container" id="bookView">

  <div class="book-page">

    <h2>📖 मेरी आत्मकथा</h2>

    <div id="bookContent"></div>

    <div
      class="no-print"
      style="text-align:center;margin-top:20px;"
    >

      <button
        class="gray"
        onclick="closeBook()"
      >
        ⬅ वापस जाएँ
      </button>

      <button
        class="green"
        onclick="window.print()"
      >
        🖨️ PDF बनाएं
      </button>

    </div>

  </div>

</div>


<div class="footer">
  मेरी जिंदगी की किताब ❤️
</div>


<script>

let chapters =
  JSON.parse(
    localStorage.getItem("meriAtmakatha")
  ) || [];

let editIndex = -1;


/* =========================
   SAVE CHAPTER
========================= */

function saveChapter(){

  const title =
    document.getElementById("chapterTitle").value.trim();

  const text =
    document.getElementById("story").value.trim();

  if(!title){
    alert("कृपया अध्याय का नाम लिखें।");
    return;
  }

  if(!text){
    alert("कृपया अपनी कहानी लिखें।");
    return;
  }

  const data = {
    title:title,
    text:text,
    date:new Date().toLocaleDateString("hi-IN")
  };

  if(editIndex === -1){
    chapters.push(data);
  }else{
    chapters[editIndex] = data;
    editIndex = -1;
  }

  localStorage.setItem(
    "meriAtmakatha",
    JSON.stringify(chapters)
  );

  clearForm();
  showChapters();

  alert("अध्याय सफलतापूर्वक सेव हो गया।");
}


/* =========================
   SHOW CHAPTERS
========================= */

function showChapters(){

  const list =
    document.getElementById("chapterList");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  list.innerHTML = "";

  let found = 0;

  chapters.forEach((chapter,index)=>{

    const content =
      (chapter.title+" "+chapter.text)
        .toLowerCase();

    if(search && !content.includes(search)){
      return;
    }

    found++;

    const div =
      document.createElement("div");

    div.className = "chapter";

    div.innerHTML = `

      <h3>
        ${escapeHTML(chapter.title)}
      </h3>

      <small>
        📅 ${chapter.date || ""}
      </small>

      <p class="chapter-text">
        ${escapeHTML(chapter.text)}
      </p>

      <div class="actions">

        <button
          class="primary"
          onclick="editChapter(${index})"
        >
          ✏️ Edit
        </button>

        <button
          class="red"
          onclick="deleteChapter(${index})"
        >
          🗑️ Delete
        </button>

        <button
          class="blue"
          onclick="speakText(${index})"
        >
          🔊 सुनें
        </button>

      </div>
    `;

    list.appendChild(div);

  });

  if(found === 0){

    list.innerHTML = `
      <div class="empty">
        अभी कोई अध्याय नहीं है।
      </div>
    `;
  }
}


/* =========================
   EDIT
========================= */

function editChapter(index){

  const chapter =
    chapters[index];

  document.getElementById("chapterTitle")
    .value = chapter.title;

  document.getElementById("story")
    .value = chapter.text;

  editIndex = index;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   DELETE
========================= */

function deleteChapter(index){

  if(!confirm(
    "क्या आप यह अध्याय हटाना चाहते हैं?"
  )){
    return;
  }

  chapters.splice(index,1);

  localStorage.setItem(
    "meriAtmakatha",
    JSON.stringify(chapters)
  );

  showChapters();
}


/* =========================
   CLEAR
========================= */

function clearForm(){

  document.getElementById("chapterTitle")
    .value = "";

  document.getElementById("story")
    .value = "";

  editIndex = -1;

  stopSpeech();
}


/* =========================
   VOICE TO TEXT
========================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "आपके ब्राउज़र में Voice Typing उपलब्ध नहीं है। Chrome में खोलकर कोशिश करें।"
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "hi-IN";

  recognition.continuous = true;

  recognition.interimResults = true;

  const button =
    document.getElementById("voiceBtn");

  button.classList.add("listening");

  button.innerText =
    "🔴 सुन रहा हूँ... बोलिए";

  recognition.start();

  recognition.onresult =
    function(event){

      let finalText = "";

      for(
        let i=event.resultIndex;
        i<event.results.length;
        i++
      ){

        if(event.results[i].isFinal){

          finalText +=
            event.results[i][0].transcript;
        }
      }

      if(finalText){

        const textarea =
          document.getElementById("story");

        textarea.value +=
          (textarea.value ? " " : "") +
          finalText;
      }
    };

  recognition.onerror =
    function(){

      button.classList.remove(
        "listening"
      );

      button.innerText =
        "🎤 आवाज़ से लिखें";
    };

  recognition.onend =
    function(){

      button.classList.remove(
        "listening"
      );

      button.innerText =
        "🎤 आवाज़ से लिखें";
    };
}


/* =========================
   TEXT TO SPEECH
========================= */

let currentSpeech = null;

function speakStory(){

  const text =
    document.getElementById("story")
      .value.trim();

  if(!text){

    alert(
      "पहले कहानी लिखें या आवाज़ से लिखें।"
    );

    return;
  }

  speakTextContent(text);
}


function speakText(index){

  const chapter =
    chapters[index];

  if(!chapter) return;

  speakTextContent(
    chapter.title + ". " +
    chapter.text
  );
}


function speakTextContent(text){

  if(!("speechSynthesis" in window)){

    alert(
      "आपके डिवाइस में Text-to-Speech उपलब्ध नहीं है।"
    );

    return;
  }

  speechSynthesis.cancel();

  const language =
    document.getElementById("speechLanguage")
      .value;

  const rate =
    parseFloat(
      document.getElementById("speechRate")
        .value
    );

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = language;

  utterance.rate = rate;

  utterance.pitch = 1;

  currentSpeech = utterance;

  const voices =
    speechSynthesis.getVoices();

  const matchingVoice =
    voices.find(
      voice =>
        voice.lang.toLowerCase()
          .startsWith(
            language.substring(0,2).toLowerCase()
          )
    );

  if(matchingVoice){
    utterance.voice =
      matchingVoice;
  }

  speechSynthesis.speak(
    utterance
  );
}


/* =========================
   PAUSE
========================= */

function pauseSpeech(){

  if("speechSynthesis" in window){
    speechSynthesis.pause();
  }
}


/* =========================
   RESUME
========================= */

function resumeSpeech(){

  if("speechSynthesis" in window){
    speechSynthesis.resume();
  }
}


/* =========================
   STOP
========================= */

function stopSpeech(){

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

  currentSpeech = null;
}


/* =========================
   BOOK VIEW
========================= */

function openBook(){

  if(chapters.length === 0){

    alert(
      "पहले कम से कम एक अध्याय सेव करें।"
    );

    return;
  }

  document.querySelector(
    ".container.no-print"
  ).style.display = "none";

  document.getElementById(
    "bookView"
  ).style.display = "block";

  let html = "";

  chapters.forEach(
    (chapter,index)=>{

      html += `

        <h3>
          ${index+1}.
          ${escapeHTML(chapter.title)}
        </h3>

        <small>
          📅 ${chapter.date || ""}
        </small>

        <p style="white-space:pre-wrap;">
          ${escapeHTML(chapter.text)}
        </p>

        <hr>

      `;
    }
  );

  document.getElementById(
    "bookContent"
  ).innerHTML = html;

  window.scrollTo(0,0);
}


/* =========================
   CLOSE BOOK
========================= */

function closeBook(){

  document.getElementById(
    "bookView"
  ).style.display = "none";

  document.querySelector(
    ".container.no-print"
  ).style.display = "block";
}


/* =========================
   PRINT
========================= */

function printBook(){

  openBook();

  setTimeout(()=>{
    window.print();
  },300);
}


/* =========================
   BACKUP
========================= */

function backupData(){

  const data =
    JSON.stringify(
      chapters,
      null,
      2
    );

  const blob =
    new Blob(
      [data],
      {
        type:"application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "meri-atmakatha-backup.json";

  a.click();

  URL.revokeObjectURL(url);
}


/* =========================
   IMPORT
========================= */

function importData(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload =
    function(e){

      try{

        const data =
          JSON.parse(
            e.target.result
          );

        if(!Array.isArray(data)){
          throw new Error();
        }

        chapters = data;

        localStorage.setItem(
          "meriAtmakatha",
          JSON.stringify(chapters)
        );

        showChapters();

        alert(
          "Backup सफलतापूर्वक वापस आ गया।"
        );

      }catch(error){

        alert(
          "Backup file सही नहीं है।"
        );
      }
    };

  reader.readAsText(file);
}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   LOAD VOICES
========================= */

if("speechSynthesis" in window){

  speechSynthesis.onvoiceschanged =
    function(){
      speechSynthesis.getVoices();
    };
}


/* =========================
   START
========================= */

showChapters();

</script>

</body>
</html>
