<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>आत्मकथा - ईमेल लॉगिन</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .auth-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-login {
      background-color: #007bff;
      color: white;
    }
    .btn-login:hover {
      background-color: #0056b3;
    }
    .btn-signup {
      background-color: #28a745;
      color: white;
    }
    .btn-signup:hover {
      background-color: #218838;
    }
    #status-msg {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>आत्मकथा</h2>

    <!-- ईमेल और पासवर्ड इनपुट -->
    <input type="email" id="email-input" placeholder="ईमेल आईडी दर्ज करें">
    <input type="password" id="password-input" placeholder="पासवर्ड दर्ज करें (कम से कम 6 अंक)">

    <button id="login-btn" class="btn-login">लॉगिन करें</button>
    <button id="signup-btn" class="btn-signup">नया खाता बनाएँ (Sign Up)</button>

    <div id="status-msg"></div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // आपके प्रोजेक्ट की जानकारी
    const firebaseConfig = {
      apiKey: "अपनी_API_KEY_यहाँ_डालें",
      authDomain: "zeebook-da86f.firebaseapp.com",
      projectId: "zeebook-da86f",
      storageBucket: "zeebook-da86f.appspot.com",
      messagingSenderId: "अपना_SENDER_ID_यहाँ_डालें",
      appId: "अपना_APP_ID_यहाँ_डालें"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const statusMsg = document.getElementById("status-msg");

    // 1. लॉगिन करने का कोड
    document.getElementById("login-btn").addEventListener("click", () => {
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value.trim();

      if (!email || !password) {
        alert("कृपया ईमेल और पासवर्ड दोनों दर्ज करें।");
        return;
      }

      statusMsg.innerText = "लॉगिन किया जा रहा है...";

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          alert("लॉगिन सफल रहा! स्वागत है: " + user.email);
          statusMsg.innerText = "सफल!";
          // यहाँ लॉगिन के बाद अगला पेज खोल सकते हैं:
          // window.location.href = "home.html";
        })
        .catch((error) => {
          statusMsg.innerText = "";
          alert("लॉगिन में समस्या: " + error.message);
        });
    });

    // 2. नया खाता (Sign Up) बनाने का कोड
    document.getElementById("signup-btn").addEventListener("click", () => {
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value.trim();

      if (!email || !password) {
        alert("कृपया ईमेल और पासवर्ड दोनों दर्ज करें।");
        return;
      }

      if (password.length < 6) {
        alert("पासवर्ड कम से कम 6 अक्षरों का होना चाहिए।");
        return;
      }

      statusMsg.innerText = "खाता बनाया जा रहा है...";

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          alert("नया खाता सफलतापूर्वक बन गया! स्वागत है: " + user.email);
          statusMsg.innerText = "सफल!";
        })
        .catch((error) => {
          statusMsg.innerText = "";
          alert("खाता बनाने में समस्या: " + error.message);
        });
    });
  </script>

</body>
</html>
