<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>मेरी आत्मकथा - मेरी जिंदगी की किताब</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{
  background:linear-gradient(135deg,#5b21b6,#2563eb);
  color:white;
  text-align:center;
  padding:25px 15px;
  border-radius:0 0 25px 25px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
  font-size:15px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  margin:15px 0;
  padding:18px;
  border-radius:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
  color:#4f46e5;
  margin-top:0;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

textarea{
  min-height:180px;
  resize:vertical;
}

button{
  border:0;
  padding:11px 15px;
  margin:5px 3px;
  border-radius:10px;
  background:#4f46e5;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.green{
  background:#16a34a;
}

.red{
  background:#dc2626;
}

.orange{
  background:#ea580c;
}

.gray{
  background:#475569;
}

.voiceActive{
  background:#dc2626 !important;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.04)}
  100%{transform:scale(1)}
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.controls button{
  flex:1;
  min-width:100px;
}

.chapter{
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  margin:12px 0;
  background:#fafafa;
}

.chapter h3{
  margin-top:0;
  color:#3730a3;
}

.storyText{
  white-space:pre-wrap;
  line-height:1.8;
}

.small{
  font-size:13px;
  color:#666;
}

.bookPage{
  background:#fffdf5;
  padding:25px;
  border-radius:12px;
  line-height:2;
  font-size:17px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.status{
  padding:10px;
  border-radius:10px;
  background:#eef2ff;
  margin-top:8px;
  font-weight:bold;
}

@media(max-width:600px){
  header h1{
    font-size:23px;
  }

  .card{
    padding:14px;
  }

  button{
    font-size:14px;
  }
}

@media print{
  header,
  .noPrint{
    display:none!important;
  }

  body{
    background:white;
  }

  .card{
    box-shadow:none;
    border:0;
  }
}
</style>
</head>

<body>

<header>
  <h1>📖 मेरी आत्मकथा</h1>
  <p>मेरी जिंदगी की किताब</p>
</header>

<div class="container">

<!-- SEARCH -->
<div class="card">
  <input
    id="searchBox"
    type="text"
    placeholder="🔎 अध्याय खोजें..."
    oninput="searchChapters()"
  >
</div>


<!-- NEW CHAPTER -->
<div class="card">

  <h2>✍️ नया अध्याय</h2>

  <input
    id="chapterTitle"
    type="text"
    placeholder="अध्याय का नाम लिखें"
  >

  <textarea
    id="story"
    placeholder="यहाँ अपनी कहानी लिखें या आवाज़ से बोलें..."
  ></textarea>

  <div class="controls">

    <button
      id="voiceButton"
      class="green"
      onclick="toggleVoice()">
      🎤 बोलकर लिखें
    </button>

    <button
      class="gray"
      onclick="clearStory()">
      🗑️ साफ करें
    </button>

    <button
      onclick="saveChapter()">
      💾 अध्याय सेव करें
    </button>

  </div>

  <div
    id="voiceStatus"
    class="status">
    🎤 बोलकर लिखने के लिए बटन दबाएँ।
  </div>

</div>


<!-- TEXT TO SPEECH -->
<div class="card">

  <h2>🔊 कहानी सुनें</h2>

  <label>भाषा चुनें:</label>

  <select id="speechLanguage">

    <option value="hi-IN">🇮🇳 हिंदी</option>

    <option value="en-IN">🇮🇳 English</option>

    <option value="en-US">🇺🇸 English (US)</option>

    <option value="ur-PK">اردو Urdu</option>

    <option value="mr-IN">मराठी</option>

    <option value="bn-IN">বাংলা Bengali</option>

    <option value="gu-IN">ગુજરાતી Gujarati</option>

    <option value="pa-IN">ਪੰਜਾਬੀ Punjabi</option>

    <option value="ta-IN">தமிழ் Tamil</option>

    <option value="te-IN">తెలుగు Telugu</option>

    <option value="kn-IN">ಕನ್ನಡ Kannada</option>

    <option value="ml-IN">മലയാളം Malayalam</option>

    <option value="ar-SA">العربية Arabic</option>

  </select>

  <label>बोलने की गति:</label>

  <select id="speechRate">

    <option value="0.6">बहुत धीमी</option>

    <option value="0.8">धीमी</option>

    <option value="1" selected>सामान्य</option>

    <option value="1.2">तेज</option>

    <option value="1.4">बहुत तेज</option>

  </select>

  <div class="controls">

    <button onclick="speakStory()">
      🔊 सुनाएँ
    </button>

    <button
      class="orange"
      onclick="pauseSpeech()">
      ⏸️ Pause
    </button>

    <button
      class="green"
      onclick="resumeSpeech()">
      ▶️ Resume
    </button>

    <button
      class="red"
      onclick="stopSpeech()">
      ⏹️ Stop
    </button>

  </div>

  <p class="small">
    यदि किसी भाषा की आवाज उपलब्ध नहीं है तो Android
    Text-to-Speech में उस भाषा की voice डाउनलोड करनी होगी।
  </p>

</div>


<!-- CHAPTERS -->
<div class="card">

  <h2>📚 मेरे अध्याय</h2>

  <div id="chapterList"></div>

</div>


<!-- BOOK -->
<div class="card">

  <h2>📕 किताब देखें</h2>

  <div id="bookView"></div>

  <div class="noPrint">

    <button onclick="printBook()">
      🖨️ Print / PDF
    </button>

  </div>

</div>


<!-- BACKUP -->
<div class="card noPrint">

  <h2>💾 Backup</h2>

  <p class="small">
    अपनी पूरी किताब का Backup सुरक्षित रखें।
  </p>

  <button onclick="backupBook()">
    ⬇️ Backup डाउनलोड करें
  </button>

  <button
    onclick="document.getElementById('importFile').click()">
    ⬆️ Backup वापस लाएँ
  </button>

  <input
    type="file"
    id="importFile"
    accept=".json"
    style="display:none"
    onchange="importBook(event)"
  >

</div>

</div>


<script>

/* =========================================
   DATA
========================================= */

let chapters =
  JSON.parse(
    localStorage.getItem("meriAtmakathaChapters")
  ) || [];

let editingIndex = -1;


/* =========================================
   SAVE DATA
========================================= */

function saveData(){

  localStorage.setItem(
    "meriAtmakathaChapters",
    JSON.stringify(chapters)
  );

}


/* =========================================
   SAVE CHAPTER
========================================= */

function saveChapter(){

  const title =
    document
    .getElementById("chapterTitle")
    .value
    .trim();

  const text =
    document
    .getElementById("story")
    .value
    .trim();


  if(!title){

    alert("कृपया अध्याय का नाम लिखें।");
    return;

  }


  if(!text){

    alert("कृपया कहानी लिखें।");
    return;

  }


  if(editingIndex === -1){

    chapters.push({

      title:title,

      text:text,

      date:new Date()
      .toLocaleDateString("hi-IN")

    });

  }else{

    chapters[editingIndex].title =
      title;

    chapters[editingIndex].text =
      text;

    editingIndex = -1;

  }


  saveData();

  renderChapters();

  renderBook();

  clearStory();

  alert("अध्याय सफलतापूर्वक सेव हो गया।");

}


/* =========================================
   CLEAR
========================================= */

function clearStory(){

  document
  .getElementById("chapterTitle")
  .value = "";

  document
  .getElementById("story")
  .value = "";

  editingIndex = -1;

}


/* =========================================
   CHAPTER LIST
========================================= */

function renderChapters(){

  const list =
    document.getElementById("chapterList");

  list.innerHTML = "";


  if(chapters.length === 0){

    list.innerHTML =
      "<p class='small'>अभी कोई अध्याय नहीं है।</p>";

    return;

  }


  chapters.forEach(function(chapter,index){

    const div =
      document.createElement("div");

    div.className = "chapter";


    div.innerHTML = `

      <h3>
        ${escapeHTML(chapter.title)}
      </h3>

      <p class="small">
        📅 ${chapter.date || ""}
      </p>

      <div class="storyText">
        ${escapeHTML(chapter.text)}
      </div>

      <div class="controls">

        <button
          onclick="editChapter(${index})">
          ✏️ Edit
        </button>

        <button
          class="red"
          onclick="deleteChapter(${index})">
          🗑️ Delete
        </button>

        <button
          class="green"
          onclick="speakText(${index})">
          🔊 सुनें
        </button>

      </div>

    `;


    list.appendChild(div);

  });

}


/* =========================================
   EDIT
========================================= */

function editChapter(index){

  const chapter =
    chapters[index];


  document
  .getElementById("chapterTitle")
  .value =
    chapter.title;


  document
  .getElementById("story")
  .value =
    chapter.text;


  editingIndex = index;


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================================
   DELETE
========================================= */

function deleteChapter(index){

  if(
    !confirm(
      "क्या आप यह अध्याय हटाना चाहते हैं?"
    )
  ){

    return;

  }


  chapters.splice(index,1);

  saveData();

  renderChapters();

  renderBook();

}


/* =========================================
   SEARCH
========================================= */

function searchChapters(){

  const query =
    document
    .getElementById("searchBox")
    .value
    .toLowerCase()
    .trim();


  const items =
    document.querySelectorAll(".chapter");


  items.forEach(function(item){

    const text =
      item.innerText.toLowerCase();


    item.style.display =
      text.includes(query)
      ? ""
      : "none";

  });

}


/* =========================================
   BOOK VIEW
========================================= */

function renderBook(){

  const book =
    document.getElementById("bookView");

  book.innerHTML = "";


  if(chapters.length === 0){

    book.innerHTML =
      "<p class='small'>आपकी किताब अभी खाली है।</p>";

    return;

  }


  chapters.forEach(function(chapter,index){

    const page =
      document.createElement("div");

    page.className = "bookPage";


    page.innerHTML = `

      <h2>
        अध्याय ${index + 1} :
        ${escapeHTML(chapter.title)}
      </h2>

      <p class="storyText">
        ${escapeHTML(chapter.text)}
      </p>

    `;


    book.appendChild(page);

  });

}


/* =========================================
   PRINT
========================================= */

function printBook(){

  window.print();

}


/* =========================================
   VOICE TO TEXT
   CONTINUOUS SMOOTH VERSION
========================================= */

let recognition = null;

let voiceListening = false;

let voiceStopping = false;


/* CREATE RECOGNITION */

function createRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    return null;

  }


  const rec =
    new SpeechRecognition();


  /* हिंदी */

  rec.lang = "hi-IN";


  /*
    लगातार सुनने की कोशिश
  */

  rec.continuous = true;


  /*
    बोलते समय भी text देता रहे
  */

  rec.interimResults = true;


  /*
    कई results याद रखे
  */

  rec.maxAlternatives = 1;


  rec.onstart = function(){

    voiceListening = true;

    voiceStopping = false;

    updateVoiceButton(true);

    setVoiceStatus(
      "🎤 सुन रहा हूँ... लगातार बोलते जाइए।"
    );

  };


  rec.onresult = function(event){

    const story =
      document.getElementById("story");


    let finalText = "";

    let interimText = "";


    /*
      सिर्फ नए results को process करना
    */

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      const transcript =
        event.results[i][0].transcript;


      if(event.results[i].isFinal){

        finalText +=
          transcript + " ";

      }else{

        interimText +=
          transcript;

      }

    }


    /*
      Final text को textarea में जोड़ना
    */

    if(finalText.trim()){

      const oldText =
        story.value.trim();


      if(oldText){

        story.value =
          oldText +
          " " +
          finalText.trim();

      }else{

        story.value =
          finalText.trim();

      }

    }


    /*
      अस्थायी बोलने की स्थिति दिखाएँ
    */

    if(interimText){

      setVoiceStatus(
        "🎤 सुन रहा हूँ: " +
        interimText
      );

    }else{

      setVoiceStatus(
        "🎤 सुन रहा हूँ... बोलते जाइए।"
      );

    }

  };


  rec.onerror = function(event){

    /*
      कुछ errors में browser को
      खुद दोबारा start करना है।
    */

    if(
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ){

      voiceListening = false;

      voiceStopping = true;

      updateVoiceButton(false);

      setVoiceStatus(
        "⚠️ Microphone की अनुमति नहीं मिली।"
      );

      return;

    }


    if(event.error === "no-speech"){

      setVoiceStatus(
        "🎤 आवाज़ नहीं मिली, फिर से सुन रहा हूँ..."
      );

      return;

    }


    setVoiceStatus(
      "🎤 फिर से सुनने की कोशिश हो रही है..."
    );

  };


  rec.onend = function(){

    /*
      अगर user ने Stop नहीं किया है,
      तो recognition फिर शुरू करें।
    */

    if(
      voiceListening &&
      !voiceStopping
    ){

      setTimeout(function(){

        try{

          rec.start();

        }catch(error){

          /*
            अगर पहले से running हो तो
            कुछ नहीं करना।
          */

        }

      },300);

    }else{

      voiceListening = false;

      updateVoiceButton(false);

    }

  };


  return rec;

}


/* =========================================
   START / STOP VOICE
========================================= */

function toggleVoice(){

  if(voiceListening){

    stopVoice();

  }else{

    startVoice();

  }

}


/* =========================================
   START VOICE
========================================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "आपके ब्राउज़र में Voice Typing उपलब्ध नहीं है।\n\n" +
      "Chrome में यह सुविधा इस्तेमाल करें।"
    );

    return;

  }


  voiceStopping = false;

  voiceListening = true;


  recognition =
    createRecognition();


  if(!recognition){

    alert(
      "Voice Typing शुरू नहीं हो सका।"
    );

    voiceListening = false;

    return;

  }


  try{

    recognition.start();

  }catch(error){

    setVoiceStatus(
      "🎤 आवाज़ सुनने की कोशिश हो रही है..."
    );

  }

}


/* =========================================
   STOP VOICE
========================================= */

function stopVoice(){

  voiceStopping = true;

  voiceListening = false;


  if(recognition){

    try{

      recognition.stop();

    }catch(error){}

  }


  updateVoiceButton(false);


  setVoiceStatus(
    "⏹️ आवाज़ से लिखना बंद है।"
  );

}


/* =========================================
   VOICE BUTTON
========================================= */

function updateVoiceButton(active){

  const button =
    document.getElementById(
      "voiceButton"
    );


  if(active){

    button.innerText =
      "⏹️ सुनना बंद करें";

    button.classList.add(
      "voiceActive"
    );

  }else{

    button.innerText =
      "🎤 बोलकर लिखें";

    button.classList.remove(
      "voiceActive"
    );

  }

}


/* =========================================
   VOICE STATUS
========================================= */

function setVoiceStatus(message){

  const status =
    document.getElementById(
      "voiceStatus"
    );


  if(status){

    status.innerText =
      message;

  }

}


/* =========================================
   TEXT TO SPEECH
========================================= */

let availableVoices = [];


function loadVoices(){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  availableVoices =
    speechSynthesis.getVoices();

}


if(
  "speechSynthesis" in window
){

  loadVoices();


  speechSynthesis.onvoiceschanged =
    function(){

      loadVoices();

    };

}


/* =========================================
   FIND SPEECH VOICE
========================================= */

function findBestVoice(language){

  if(
    !availableVoices.length
  ){

    availableVoices =
      speechSynthesis.getVoices();

  }


  const wanted =
    language.toLowerCase();


  let voice =
    availableVoices.find(
      function(v){

        return (
          v.lang.toLowerCase() ===
          wanted
        );

      }
    );


  if(voice){

    return voice;

  }


  const shortLanguage =
    wanted.split("-")[0];


  voice =
    availableVoices.find(
      function(v){

        return v.lang
          .toLowerCase()
          .startsWith(
            shortLanguage
          );

      }
    );


  return voice || null;

}


/* =========================================
   SPEAK STORY
========================================= */

function speakStory(){

  const text =
    document
    .getElementById("story")
    .value
    .trim();


  if(!text){

    alert(
      "पहले कहानी लिखें या आवाज़ से लिखें।"
    );

    return;

  }


  speakTextContent(text);

}


/* =========================================
   SPEAK CHAPTER
========================================= */

function speakText(index){

  const chapter =
    chapters[index];


  if(!chapter){

    return;

  }


  speakTextContent(
    chapter.title +
    ". " +
    chapter.text
  );

}


/* =========================================
   ACTUAL SPEECH
========================================= */

function speakTextContent(text){

  if(
    !("speechSynthesis" in window)
  ){

    alert(
      "आपके फोन में Text-to-Speech उपलब्ध नहीं है।"
    );

    return;

  }


  const language =
    document
    .getElementById(
      "speechLanguage"
    )
    .value;


  const rate =
    parseFloat(
      document
      .getElementById(
        "speechRate"
      )
      .value
    );


  speechSynthesis.cancel();


  setTimeout(function(){

    loadVoices();


    const voice =
      findBestVoice(language);


    if(!voice){

      alert(
        "⚠️ इस भाषा की Voice आपके फोन में उपलब्ध नहीं है।\n\n" +
        "Android Text-to-Speech Settings में जाकर " +
        "इस भाषा की Voice डाउनलोड करें।"
      );

      return;

    }


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      voice.lang;


    utterance.voice =
      voice;


    utterance.rate =
      rate;


    utterance.pitch =
      1;


    speechSynthesis.speak(
      utterance
    );


  },200);

}


/* =========================================
   PAUSE SPEECH
========================================= */

function pauseSpeech(){

  if(
    "speechSynthesis" in window &&
    speechSynthesis.speaking
  ){

    speechSynthesis.pause();

  }

}


/* =========================================
   RESUME SPEECH
========================================= */

function resumeSpeech(){

  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.resume();

  }

}


/* =========================================
   STOP SPEECH
========================================= */

function stopSpeech(){

  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.cancel();

  }

}


/* =========================================
   BACKUP
========================================= */

function backupBook(){

  const data =
    JSON.stringify(
      chapters,
      null,
      2
    );


  const blob =
    new Blob(
      [data],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "meri-atmakatha-backup.json";


  a.click();


  URL.revokeObjectURL(url);

}


/* =========================================
   IMPORT BACKUP
========================================= */

function importBook(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      try{

        const data =
          JSON.parse(
            e.target.result
          );


        if(
          !Array.isArray(data)
        ){

          alert(
            "यह सही Backup file नहीं है।"
          );

          return;

        }


        chapters = data;


        saveData();

        renderChapters();

        renderBook();


        alert(
          "Backup सफलतापूर्वक वापस आ गया।"
        );


      }catch(error){

        alert(
          "Backup file पढ़ने में समस्या हुई।"
        );

      }

    };


  reader.readAsText(file);

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   START APP
========================================= */

renderChapters();

renderBook();

</script>
